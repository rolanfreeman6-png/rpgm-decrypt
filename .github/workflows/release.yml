name: release

# Self-contained CI + release on GitHub Actions.
#
#   * test        — build + run the full test suite on Linux (every push/PR/tag).
#   * linux-x64   — static-ish native binary, appended to the release.
#   * windows-x64 — native .exe + zlib1.dll + decrypt.bat, zipped and appended.
#   * macos-arm64 — native binary, appended.
#
# The three publish jobs run only on v* tags and only after `test` passes. They
# use the auto-provided GITHUB_TOKEN (no PAT needed) and are idempotent:
# whichever job creates the release first, the others upload with --clobber.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ocaml

jobs:
  # ---- build + test (gate for the release jobs) ------------------------------
  test:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Install deps
        run: opam install -y dune camlzip yojson re qcheck-core

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest --force

  # ---- Linux x86-64 native binary --------------------------------------------
  linux-x64:
    name: publish (linux-x64)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build the Linux binary (release)
        run: |
          opam install -y dune camlzip yojson re
          opam exec -- dune build --profile release bin/main.exe
          cp _build/default/bin/main.exe ../rpgm-decrypt-linux-x64
          chmod +x ../rpgm-decrypt-linux-x64
          ../rpgm-decrypt-linux-x64 --version

      - name: Append the binary to the GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main \
              --title "$TAG" \
              --notes "rpgm-decrypt $TAG — decrypts RPG Maker games. By default it writes a full, ready-to-run decrypted copy of the game (all non-asset files preserved); use --assets-only for just the decrypted media. Binaries for Linux, Windows and macOS are attached to this release."
          fi
          gh release upload "$TAG" rpgm-decrypt-linux-x64 --repo "$GITHUB_REPOSITORY" --clobber

  # ---- Windows x86-64: native .exe + zlib1.dll + decrypt.bat, in a zip -------
  # camlzip links zlib dynamically on mingw, so the .exe needs zlib1.dll at
  # runtime — bundled next to the .exe plus the drag-and-drop decrypt.bat.
  windows-x64:
    name: publish (windows-x64, zip)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml (opam + mingw64)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build the .exe + bundle the zip
        shell: pwsh
        run: |
          opam install -y dune camlzip yojson re
          opam exec -- dune build --profile release bin/main.exe
          Copy-Item _build/default/bin/main.exe rpgm-decrypt.exe
          $root   = opam var root
          $prefix = opam var prefix
          $dll = Get-ChildItem -Path $root,$prefix -Recurse -Filter zlib1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "zlib1.dll not found under opam root=$root or prefix=$prefix" }
          Write-Output "Found zlib1.dll: $($dll.FullName)"
          Copy-Item $dll.FullName zlib1.dll
          Copy-Item ../packaging/decrypt.bat decrypt.bat
          Compress-Archive -Path rpgm-decrypt.exe, zlib1.dll, decrypt.bat `
            -DestinationPath rpgm-decrypt-windows-x64.zip -Force

      - name: Smoke-test the .exe with the bundled DLL
        shell: pwsh
        run: |
          Expand-Archive rpgm-decrypt-windows-x64.zip -DestinationPath smoke -Force
          ./smoke/rpgm-decrypt.exe --version

      - name: Append the zip to the GitHub Release
        working-directory: ocaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main `
              --title $tag `
              --notes "rpgm-decrypt $tag — Windows x86-64. Extract the zip (rpgm-decrypt.exe + zlib1.dll + decrypt.bat), then drag a game folder onto decrypt.bat for a full decrypted copy."
          }
          gh release upload $tag rpgm-decrypt-windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber

  # ---- Windows GUI (Ruby + GTK3 hybrid front-end) ---------------------------
  # Builds the rpgm-decrypt.exe decrypter first, then bundles the Ruby/GTK3 GUI
  # with OCRA (rpgm-decrypt-gui.exe + GTK3 runtime) and uploads it as a separate
  # release asset. The CLI assets above are left untouched.
  gui-windows:
    name: publish (gui-windows-x64, zip)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml (opam + mingw64)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build the OCaml decrypter (.exe + zlib1.dll)
        shell: pwsh
        working-directory: ocaml
        run: |
          opam install -y dune camlzip yojson re
          opam exec -- dune build --profile release bin/main.exe
          # dist-win/ is gitignored, so it does not exist on a fresh checkout.
          New-Item -ItemType Directory -Force ../ocaml/dist-win | Out-Null
          Copy-Item _build/default/bin/main.exe ../ocaml/dist-win/rpgm-decrypt.exe -Force
          $root   = opam var root
          $prefix = opam var prefix
          $dll = Get-ChildItem -Path $root,$prefix -Recurse -Filter zlib1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "zlib1.dll not found under opam root=$root or prefix=$prefix" }
          Copy-Item $dll.FullName ../ocaml/dist-win/zlib1.dll -Force

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: gui

      - name: Install GTK3 runtime (MSYS2)
        shell: pwsh
        run: |
          # Run from pwsh (not shell: bash): setup-ruby puts Ruby's bundled
          # msys2 bash first on PATH, and bash scalars strip backslashes.
          # Print WHERE pacman actually installs: runners have been seen
          # reporting success while C:\msys64\ucrt64 stayed empty (staging
          # found nothing -> zip shipped without the GTK runtime).
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-libffi mingw-w64-ucrt-x86_64-gcc-libs mingw-w64-ucrt-x86_64-libwinpthread mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-gettext-runtime mingw-w64-ucrt-x86_64-libiconv; echo "ROOT=$(cygpath -w /)"; pacman -Ql mingw-w64-ucrt-x86_64-gtk3 | grep "bin/libgtk-3-0.dll$" || true; echo "UCRT64BIN=$(cygpath -w /ucrt64/bin 2>/dev/null)"'
          if ($LASTEXITCODE -ne 0) { throw "pacman failed (exit $LASTEXITCODE)" }
          $n = @(Get-ChildItem C:\msys64\ucrt64\bin -Filter *.dll -ErrorAction SilentlyContinue).Count
          Write-Output "C:\msys64\ucrt64\bin holds $n DLLs after pacman"
          # The runner image and the pacman database disagree: packages the DB
          # calls installed can be absent on disk (glib2 loads libffi-8.dll,
          # and its absence kills the packed GUI with exit 1). The extra
          # package names above force a reinstall; verify the load-critical
          # DLLs exist rather than trusting the exit code.
          foreach ($d in 'libffi-8.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll',
                        'libintl-8.dll', 'libiconv-2.dll', 'zlib1.dll') {
            if (-not (Test-Path (Join-Path 'C:\msys64\ucrt64\bin' $d))) {
              throw "GTK base DLL missing after pacman: $d"
            }
          }

      - name: Install GUI gems
        shell: pwsh
        working-directory: gui
        run: |
          gem install gtk3 ocra

      - name: Windows Defender exclusions (OCRA stub writing trips real-time scan)
        shell: pwsh
        run: |
          # The OCRA builder writes a ruby stub .exe with embedded scripts —
          # behaviour Defender's real-time heuristics flag, killing ruby
          # silently (exit 1, zero output) mid-build on hosted runners.
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Continue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction Continue
          Add-MpPreference -ExclusionProcess ruby.exe -ErrorAction Continue
          Add-MpPreference -ExclusionProcess rubyw.exe -ErrorAction Continue

      - name: Build + bundle the GUI zip
        shell: pwsh
        working-directory: gui
        run: |
          # Default -GtkPrefix is ucrt64 — the prefix GTK was just installed to.
          ./build_windows.ps1

      - name: Smoke-test the GUI bundle
        shell: pwsh
        working-directory: gui
        run: |
          Expand-Archive rpgm-decrypt-gui-windows-x64.zip -DestinationPath gui-smoke -Force
          # A zip without the GTK runtime builds "fine" and produces a GUI that
          # cannot start (shipped exactly that once) — gate on DLL presence.
          $dlls = @(Get-ChildItem gui-smoke\rpgm-decrypt-gui -Filter *.dll -Recurse).Count
          Write-Output "GUI zip carries $dlls DLLs"
          if ($dlls -lt 50) { throw "GUI zip is missing the GTK runtime (only $dlls DLLs)" }
          # Extract the OCRA stub into the workspace (already excluded from
          # Defender) instead of the runner TMPDIR.
          $t = Join-Path $env:GITHUB_WORKSPACE 'ocra-tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $t; $env:TMP = $t; $env:TMPDIR = $t
          # The bundled exe must stay alive (a windowed exe that dies on a
          # missing DLL pops a modal dialog or exits instantly — both are
          # failures here, not passes).
          $p = Start-Process -FilePath .\gui-smoke\rpgm-decrypt-gui\rpgm-decrypt-gui.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $log = 'gui-smoke\rpgm-decrypt-gui\crash.log'
            if (Test-Path $log) { Write-Output '--- crash.log ---'; Get-Content $log }
            throw "GUI exe exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id

      - name: Append the GUI zip to the GitHub Release
        working-directory: gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main `
              --title $tag `
              --notes "rpgm-decrypt $tag — Windows x86-64 GUI (Ruby + GTK3)."
          }
          gh release upload $tag rpgm-decrypt-gui-windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber

  # ---- macOS (Apple Silicon, native) -----------------------------------------
  macos-arm64:
    name: publish (macos-arm64)
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Build the macOS binary (release)
        run: |
          opam install -y dune camlzip yojson re
          opam exec -- dune build --profile release bin/main.exe
          cp _build/default/bin/main.exe ../rpgm-decrypt-macos-arm64
          chmod +x ../rpgm-decrypt-macos-arm64
          ../rpgm-decrypt-macos-arm64 --version

      - name: Append the binary to the GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main \
              --title "$TAG" \
              --notes "rpgm-decrypt $TAG — macOS (Apple Silicon)."
          fi
          gh release upload "$TAG" rpgm-decrypt-macos-arm64 --repo "$GITHUB_REPOSITORY" --clobber
