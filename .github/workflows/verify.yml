name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native-gospel:
    name: Windows native build, tests, and Gospel
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ocaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OCaml with native MinGW toolchain
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"

      - name: Install OCaml dependencies
        run: opam install -y dune camlzip yojson re qcheck-core gospel.0.3.1

      - name: Build native Windows executable
        run: opam exec -- dune build --profile release

      - name: Run native behavioural and property tests
        run: |
          opam exec -- dune exec --profile release test/test.exe
          opam exec -- dune exec --profile release test/prop/prop.exe

      - name: Patch Gospel Marshal channels for Windows
        shell: pwsh
        working-directory: .
        run: |
          $source = Join-Path $env:RUNNER_TEMP "gospel-0.3.1"
          if (Test-Path -LiteralPath $source) { Remove-Item -LiteralPath $source -Recurse -Force }
          opam source gospel.0.3.1 --dir=$source --no-switch
          if ($LASTEXITCODE -ne 0) { throw "opam source failed" }
          Copy-Item .github/workflows/gospel-windows.patch (Join-Path $source "gospel-windows.patch")
          Push-Location $source
          git apply gospel-windows.patch
          if ($LASTEXITCODE -ne 0) { throw "Gospel Windows patch no longer applies" }
          Pop-Location
          opam pin add gospel $source --yes
          opam install -y gospel.0.3.1

      - name: Run Gospel contracts on Windows
        shell: pwsh
        run: |
          $gci = Join-Path $env:RUNNER_TEMP "gospel-cmi"
          if (Test-Path -LiteralPath $gci) { Remove-Item -LiteralPath $gci -Recurse -Force }
          New-Item -ItemType Directory -Path $gci | Out-Null
          opam exec -- ocamlc -c -I $gci -o (Join-Path $gci "Types.cmo") lib/types.mli
          if ($LASTEXITCODE -ne 0) { throw "Types.mli compile failed" }
          opam exec -- ocamlc -c -I $gci -o (Join-Path $gci "Log.cmo") lib/log.mli
          if ($LASTEXITCODE -ne 0) { throw "Log.mli compile failed" }
          opam exec -- gospel check lib/crypto.mli
          if ($LASTEXITCODE -ne 0) { throw "Gospel crypto contract failed" }
          opam exec -- gospel check lib/vxace_key.mli
          if ($LASTEXITCODE -ne 0) { throw "Gospel VX Ace contract failed" }
          opam exec -- gospel check lib/rgssad_core.mli
          if ($LASTEXITCODE -ne 0) { throw "Gospel RGSSAD contract failed" }
          opam exec -- gospel check lib/dispatch.mli -L $gci
          if ($LASTEXITCODE -ne 0) { throw "Gospel dispatch contract failed" }
          opam exec -- gospel check lib/report.mli -L $gci
          if ($LASTEXITCODE -ne 0) { throw "Gospel report contract failed" }

  linux-formal:
    name: Why3 and Z3 formal verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq z3

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"

      - name: Install Why3
        run: opam install -y why3

      - name: Configure prover and discharge all goals
        shell: bash
        run: |
          eval "$(opam env)"
          why3 config detect
          why3 prove -P z3 -a split_goal_full -t 30 proofs/rpgm_proof.mlw > why3-proof.log 2>&1
          cat why3-proof.log
          valid=$(grep -cE "Prover result is: Valid" why3-proof.log || true)
          test "$valid" -eq 103
          ! grep -Eq "Prover result is: (Unknown|Failure|Timeout|HighFailure)" why3-proof.log
